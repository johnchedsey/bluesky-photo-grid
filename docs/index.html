<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Robot Impurity On Bluesky</title>
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="alternate" type="application/rss+xml" title="Robot Impurity On Bluesky RSS" href="feed.xml">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lightgallery@2.7.2/css/lightgallery.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1 data-cy="website-title">Robot Impurity On Bluesky</h1>
  <h3 class="subtitle" data-cy="website-subtitle"><a href="https://www.robotimpurity.com">Robot Impurity Photography</a>
<a href="mailto:john@robotimpurity.com">Email Me!</a>
</h3>
  <div class="nsfw-toggle-wrapper">
    <label class="nsfw-toggle" for="nsfw-toggle" title="Show or hide NSFW images">
      <input type="checkbox" id="nsfw-toggle" data-cy="nsfw-toggle" aria-label="Show NSFW images">
      <span class="nsfw-toggle-track">
        <span class="nsfw-toggle-thumb"></span>
      </span>
      <span class="nsfw-toggle-label">Show NSFW</span>
    </label>
  </div>
  <hr class="modern-hr">

  <div class="controls">
    <label for="sort-select">Sort by:</label>
    <select id="sort-select" aria-label="Sort images" data-cy="sort-select">
      <option value="date-desc">Newest First</option>
      <option value="date-asc">Oldest First</option>
      <option value="likes-desc">Most Likes</option>
      <option value="likes-asc">Least Likes</option>
      <option value="reposts-desc">Most Reposts</option>
      <option value="replies-desc">Most Replies</option>
    </select>
  </div>

  <div id="lightgallery" class="grid" data-cy="gallery-grid"></div>

  <div class="controls pagination">
    <button id="prev-btn" data-cy="prev-button">Previous</button>
    <select id="page-select" aria-label="Jump to page" data-cy="page-select"></select>
    <button id="next-btn" data-cy="next-button">Next</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/lightgallery@2.7.2/lightgallery.min.js"></script>
  <script>
    const PAGE_SIZE = 25;
    const USE_HIGHRES_TILE = true;
    const SORTS = {
      'date-desc': (a, b) => b.date.localeCompare(a.date),
      'date-asc': (a, b) => a.date.localeCompare(b.date),
      'likes-desc': (a, b) => b.likes - a.likes,
      'likes-asc': (a, b) => a.likes - b.likes,
      'reposts-desc': (a, b) => b.reposts - a.reposts,
      'replies-desc': (a, b) => b.replies - a.replies,
    };
    const DEFAULT_SORT = 'date-desc';

    const gallery = document.getElementById('lightgallery');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const pageSelect = document.getElementById('page-select');
    const sortSelect = document.getElementById('sort-select');
    const nsfwToggle = document.getElementById('nsfw-toggle');

    let lg = null;
    let allImages = [];
    let images = [];          // allImages after NSFW filter + sort
    let pageImages = [];      // images shown on the current page
    let currentPage = 1;

    function escapeHtml(text) {
      return String(text).replace(/[&<>"']/g, c => (
        { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
      ));
    }

    function readURL() {
      const params = new URLSearchParams(location.search);
      const page = parseInt(params.get('page'), 10);
      const sort = params.get('sort');
      return {
        page: page > 0 ? page : 1,
        sort: sort in SORTS ? sort : DEFAULT_SORT,
      };
    }

    function writeURL(push) {
      const params = new URLSearchParams(location.search);
      params.set('page', currentPage);
      params.set('sort', sortSelect.value);
      const url = `${location.pathname}?${params}${location.hash}`;
      if (push) history.pushState(null, '', url);
      else history.replaceState(null, '', url);
    }

    function setImageHash(index) {
      const base = location.pathname + location.search;
      const img = pageImages[index];
      history.replaceState(null, '', img ? `${base}#img-${encodeURIComponent(img.id)}` : base);
    }

    function applyFilterAndSort() {
      const pool = nsfwToggle.checked ? allImages : allImages.filter(img => !img.nsfw);
      images = [...pool].sort(SORTS[sortSelect.value]);
    }

    function totalPages() {
      return Math.max(1, Math.ceil(images.length / PAGE_SIZE));
    }

    function createTile(img, idx) {
      const anchor = document.createElement('a');
      anchor.href = img.src;
      anchor.dataset.cy = idx === 0 ? 'first-grid-item' : `grid-item-${idx}`;
      anchor.dataset.subHtml = `
        <div class='lg-sub-html'>
          <span class='description'>${escapeHtml(img.description)}</span><br>
          <span class='post-info'>Posted on ${escapeHtml(img.date)} | ❤️ ${img.likes} | 🔄 ${img.reposts} | 💬 ${img.replies}
          <a href='${escapeHtml(img.link)}' target='_blank' rel='noopener'>View it on Bluesky</a></span>
        </div>`;

      const tile = document.createElement('img');
      tile.src = USE_HIGHRES_TILE ? img.src : img.thumb;
      tile.alt = img.alt || '';
      tile.loading = 'lazy';
      anchor.appendChild(tile);
      return anchor;
    }

    // urlMode: 'push' adds an entry, 'replace' rewrites the current one, 'none' leaves the URL alone.
    function renderPage(page, urlMode = 'push') {
      currentPage = Math.min(Math.max(1, page), totalPages());
      const start = (currentPage - 1) * PAGE_SIZE;
      pageImages = images.slice(start, start + PAGE_SIZE);

      gallery.replaceChildren(...pageImages.map(createTile));
      if (lg) lg.destroy();
      lg = lightGallery(gallery, { selector: 'a', download: false, counter: false });

      pageSelect.replaceChildren(...Array.from({ length: totalPages() }, (_, i) => {
        const n = i + 1;
        return new Option(`Page ${n} of ${totalPages()}`, n, false, n === currentPage);
      }));
      prevBtn.disabled = currentPage === 1;
      nextBtn.disabled = currentPage === totalPages();

      window.scrollTo(0, 0);
      if (urlMode !== 'none') writeURL(urlMode === 'push');
    }

    function openImageFromHash() {
      if (!location.hash.startsWith('#img-')) return;
      const id = decodeURIComponent(location.hash.slice(5));
      const index = images.findIndex(img => img.id === id);
      if (index === -1) return;
      renderPage(Math.floor(index / PAGE_SIZE) + 1, 'replace');
      lg.openGallery(index % PAGE_SIZE);
    }

    async function init() {
      const response = await fetch('data/images.json');
      if (!response.ok) {
        console.error('Failed to load images.json');
        return;
      }
      allImages = await response.json();

      const { page, sort } = readURL();
      sortSelect.value = sort;
      applyFilterAndSort();
      renderPage(page, 'replace');
      openImageFromHash();
    }

    // These are attached once; lightGallery dispatches them on the gallery element.
    gallery.addEventListener('lgAfterOpen', () => setImageHash(lg.index));
    gallery.addEventListener('lgAfterSlide', (event) => setImageHash(event.detail.index));
    gallery.addEventListener('lgAfterClose', () => setImageHash(-1));

    prevBtn.onclick = () => renderPage(currentPage - 1);
    nextBtn.onclick = () => renderPage(currentPage + 1);
    pageSelect.onchange = () => renderPage(parseInt(pageSelect.value, 10));
    sortSelect.onchange = nsfwToggle.onchange = () => {
      applyFilterAndSort();
      renderPage(1);
    };

    window.onpopstate = () => {
      const { page, sort } = readURL();
      sortSelect.value = sort;
      applyFilterAndSort();
      renderPage(page, 'none');
    };

    document.addEventListener('keydown', (e) => {
      if ((lg && lg.lgOpened) || e.target.closest('select, input')) return;
      if (e.key === 'ArrowLeft' && !prevBtn.disabled) prevBtn.click();
      else if (e.key === 'ArrowRight' && !nextBtn.disabled) nextBtn.click();
    });

    init();
  </script>

  <hr class="modern-hr">
  <h3 class="footer">(c) Robot Impurity <script>document.write(new Date().getFullYear())</script>
</h3>
  <h3 class="footer">
    <a href="https://github.com/nkavassalis/bluesky-photo-grid">Powered by Bluesky Photo Grid</a>
  </h3>
</body>
</html>
